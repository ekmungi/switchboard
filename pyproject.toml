# Switchboard: run Claude Code on the full OpenRouter catalog via a managed local translator.
[project]
name = "switchboard"
version = "0.4.0"
description = "Run Claude Code on any OpenRouter model via a managed local Anthropic->OpenAI translator (CCR-driving retained as a deprecated path)."
requires-python = ">=3.12"
dependencies = ["rich>=13"]

# Not an installable package -- uv just manages the virtualenv for the script.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
