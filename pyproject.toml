# Switchboard: browse OpenRouter models and point claude-code-router (CCR) at one.
[project]
name = "switchboard"
version = "0.1.0"
description = "Browse OpenRouter models and point claude-code-router (CCR) at one."
requires-python = ">=3.12"
dependencies = ["rich>=13"]

# Not an installable package -- uv just manages the virtualenv for the script.
[tool.uv]
package = false
